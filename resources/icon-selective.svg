  <path d="M32 4 L54 12 C54 36 32 58 32 58 C32 58 10 36 10 12 Z" 
        fill="url(#selectiveIndigoGrad)" 
        stroke="#FFFFFF" 
        stroke-width="1.8" 
        stroke-linejoin="round"/>
  <!-- Sliders Motif for Selective Domain Blocking -->
  <!-- Track 1 (Left) -->
  <line x1="24" y1="20" x2="24" y2="42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="33" r="3.5" fill="#FFFFFF"/>
  <!-- Track 2 (Center) -->
  <line x1="32" y1="18" x2="32" y2="44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="25" r="3.5" fill="#FFFFFF"/>
  <!-- Track 3 (Right) -->
  <line x1="40" y1="20" x2="40" y2="42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="35" r="3.5" fill="#FFFFFF"/>
</svg>
